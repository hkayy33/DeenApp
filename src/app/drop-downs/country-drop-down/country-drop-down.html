<div class="country-dropdown">
  <input
    class="country-input"
    [(ngModel)]="searchTerm"
    (input)="filterCountries()"
    (click)="openDropdown()"
  />

  <label *ngIf="!openList">Select Country</label>
  <ul *ngIf="openList">
    <li class="drop" *ngFor="let country of filteredCountries" (click)="selectCountry(country)">
      {{ country.name }}
    </li>
  </ul>
</div>
