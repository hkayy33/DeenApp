<div class="filter-panel">
  <div class="filter-grid">
    <!-- Row 1 -->
    <div class="field span-2">
      <label for="tutor">Tutor name</label>
      <input id="tutor" type="text" placeholder="e.g. Sarah, Maths, GCSE" />
    </div>

    <div class="field">
      <label for="subject">Subject</label>
      <input id="subject" type="text" placeholder="Search..." />
    </div>

    <div class="field">
      <label for="country">Country</label>
      <input id="country" type="text" placeholder="Search..." />
    </div>

    <!-- Row 2 -->
    <div class="field">
      <label for="city">City</label>
      <input id="city" type="text" placeholder="Search..." />
    </div>

    <div class="field">
      <label for="minRating">Min rating</label>
      <input id="minRating" type="text" placeholder="Search..." />
    </div>

    <div class="field">
      <label for="sort">Sort order</label>
      <input id="sort" type="text" placeholder="Search..." />
    </div>

    <!-- Buttons -->
    <div class="actions">
      <button class="btn ghost" type="button">Reset</button>
      <button class="btn primary" type="button">Search</button>
    </div>
  </div>
</div>
